<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="580" viewBox="0 0 1380 580" role="img" aria-labelledby="title desc">
  <title id="title">Langfuse 告警 Webhook 流程</title>
  <desc id="desc">Langfuse 发出告警 Webhook，Agent Server 验证请求签名。无效签名返回 401；有效签名读取事件并返回 200，后续告警处理尚未实现。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .heading { fill: #0f172a; font-size: 30px; font-weight: 700; }
      .lane { fill: #334155; font-size: 25px; font-weight: 700; }
      .label { fill: #0f172a; font-size: 23px; font-weight: 600; }
      .detail { fill: #475569; font-size: 19px; }
      .num { fill: #fff; font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1380" height="580" rx="30" fill="#f8fafc"/>
  <text x="58" y="61" class="heading">告警如何进入 Agent Server</text>
  <text x="58" y="94" class="detail">Webhook 入口已接入；后续告警处置仍待实现</text>

  <rect x="62" y="127" width="292" height="68" rx="18" fill="#e0e7ff"/>
  <rect x="514" y="127" width="352" height="68" rx="18" fill="#dbeafe"/>
  <rect x="1031" y="127" width="286" height="68" rx="18" fill="#ccfbf1"/>
  <text x="208" y="170" class="lane" text-anchor="middle">Langfuse 告警</text>
  <text x="690" y="170" class="lane" text-anchor="middle">Webhook 请求</text>
  <text x="1174" y="170" class="lane" text-anchor="middle">Agent Server</text>

  <path d="M208 206 V529 M690 206 V529 M1174 206 V529" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 10"/>

  <circle cx="87" cy="251" r="20" fill="#4f46e5"/><text x="87" y="251" class="num">1</text>
  <text x="118" y="241" class="label">发送告警事件</text>
  <path d="M212 275 H663" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>

  <circle cx="541" cy="335" r="20" fill="#2563eb"/><text x="541" y="335" class="num">2</text>
  <text x="573" y="326" class="label">POST /api/webhooks/langfuse/alerts</text>
  <text x="573" y="355" class="detail">请求包含签名与告警事件</text>
  <path d="M694 385 H1147" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="1020" y="405" width="309" height="58" rx="15" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <circle cx="1046" cy="434" r="17" fill="#0f766e"/><text x="1046" y="434" class="num" style="font-size:16px">3</text>
  <text x="1073" y="442" class="label" style="font-size:22px">验证 Webhook 签名</text>

  <path d="M1152 482 H750" stroke="#0f766e" stroke-width="3.5" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="790" y="470" class="detail">有效：读取事件，返回 200</text>
  <path d="M1148 515 H750" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrow-red)"/>
  <text x="790" y="548" class="detail">无效：返回 401</text>
</svg>
