<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="960" viewBox="0 0 1680 960" role="img" aria-labelledby="title desc">
  <title id="title">Langfuse 使用最佳实践</title>
  <desc id="desc">Trace 产生 Observation，并可进入 Playground。代表性 Trace 与预定义用例汇入数据集，经过实验形成离线评估；Trace 和 Observation 经规则触发线上评估。评估得分、Trace 与 Observation 都可用于告警和 Dashboard。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#60718a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { fill: #17243b; font-size: 36px; font-weight: 750; }
      .lane { fill: #66758d; font-size: 21px; font-weight: 700; letter-spacing: 2px; }
      .label { fill: #17243b; font-size: 29px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #17243b; font-size: 25px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .flow { fill: none; stroke: #60718a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .muted { fill: none; stroke: #9aa8b9; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1680" height="960" rx="30" fill="#f8fafc"/>
  <text x="72" y="70" class="title">Langfuse 使用最佳实践</text>

  <rect x="52" y="108" width="1576" height="171" rx="24" fill="#edf5ff"/>
  <text x="77" y="145" class="lane">追踪与演练</text>
  <rect x="92" y="174" width="270" height="78" rx="18" fill="#dbeafe" stroke="#80b4f5" stroke-width="2"/>
  <text x="227" y="213" class="label">Trace</text>
  <path d="M365 213 H650" class="flow"/>
  <rect x="662" y="174" width="270" height="78" rx="18" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="797" y="213" class="label">Playground</text>

  <text x="77" y="326" class="lane">线上评估</text>
  <rect x="92" y="358" width="270" height="78" rx="18" fill="#e7f2ff" stroke="#aacdf6" stroke-width="2"/>
  <text x="227" y="397" class="label">Observation</text>
  <path d="M227 253 V345" class="flow"/>
  <path d="M365 397 H565" class="flow"/>
  <rect x="578" y="358" width="246" height="78" rx="18" fill="#dcf3f0" stroke="#7accc0" stroke-width="2"/>
  <text x="701" y="397" class="label">规则</text>
  <path d="M827 397 H995" class="flow"/>
  <rect x="1008" y="358" width="260" height="78" rx="18" fill="#d9f4ef" stroke="#6acaba" stroke-width="2"/>
  <text x="1138" y="397" class="label">线上评估</text>
  <path d="M1271 397 H1400" class="flow"/>
  <rect x="1413" y="358" width="174" height="78" rx="18" fill="#e2f6ec" stroke="#87d5a6" stroke-width="2"/>
  <text x="1500" y="397" class="label">得分</text>

  <text x="77" y="501" class="lane">离线评估</text>
  <rect x="92" y="545" width="270" height="78" rx="18" fill="#f5edff" stroke="#cbb0ef" stroke-width="2"/>
  <text x="227" y="584" class="small">预定义用例</text>
  <path d="M365 584 H565" class="flow"/>
  <rect x="578" y="545" width="246" height="78" rx="18" fill="#f0e7ff" stroke="#bfa4ee" stroke-width="2"/>
  <text x="701" y="584" class="label">数据集</text>
  <path d="M92 213 H68 V650 H701 V627" class="muted"/>
  <path d="M827 584 H995" class="flow"/>
  <rect x="1008" y="545" width="260" height="78" rx="18" fill="#f0e7ff" stroke="#bfa4ee" stroke-width="2"/>
  <text x="1138" y="584" class="label">实验</text>
  <path d="M1271 584 H1400" class="flow"/>
  <rect x="1413" y="545" width="174" height="78" rx="18" fill="#eee6fc" stroke="#baa2e3" stroke-width="2"/>
  <text x="1500" y="584" class="small">评估 / 得分</text>

  <rect x="52" y="675" width="1576" height="232" rx="24" fill="#fff7ed"/>
  <text x="77" y="713" class="lane">监控与反馈</text>
  <rect x="92" y="757" width="644" height="91" rx="18" fill="#fff" stroke="#f2c998" stroke-width="2"/>
  <text x="414" y="802" class="small">Trace　·　Observation　·　得分</text>
  <path d="M740 802 H965" class="flow"/>
  <path d="M973 802 V763 H1110" class="flow"/>
  <path d="M973 802 V842 H1110" class="flow"/>
  <text x="1040" y="747" class="lane" style="font-size:19px; letter-spacing:0">条件</text>
  <rect x="1124" y="728" width="366" height="72" rx="18" fill="#ffedd5" stroke="#f5ba70" stroke-width="2"/>
  <text x="1307" y="764" class="label">告警</text>
  <rect x="1124" y="807" width="366" height="72" rx="18" fill="#ffedd5" stroke="#f5ba70" stroke-width="2"/>
  <text x="1307" y="843" class="label">Dashboard</text>
</svg>
