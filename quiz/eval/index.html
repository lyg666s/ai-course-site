102abea3e3d0e4.js\",\"206\",\"static/chunks/app/quiz/%5Bkey%5D/page-a146950e24f86a50.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"main\",null,{\"className\":\"mx-auto max-w-[56rem] px-4 pb-20 pt-6 sm:px-6\",\"children\":[\"$\",\"$L10\",null,{\"courseKey\":\"eval\",\"title\":\"Agent 观测与评估\",\"intro\":\"按「观测底座 → 评估体系 → 实验上线」三个板块整理。每题提交后立即判分并显示解析，建议先自己口述答案，再选选项。\",\"blocks\":[{\"id\":\"observe\",\"name\":\"观测底座\",\"range\":\"第 1-6 章\",\"questions\":[{\"q\":\"在 Langfuse 里，Trace 和 Observation 的关系是？\",\"options\":[\"Observation 是一次完整请求，Trace 是其中的一个字段\",\"两者完全等价，只是叫法不同\",\"Trace 是一次完整请求链路，Observation 是链路中的节点\",\"Trace 只存错误，Observation 只存模型调用\"],\"answer\":2,\"explain\":\"Trace 把一次请求的调用树串起来，Observation 是树上的节点，例如 generation、tool、retriever。\"},{\"q\":\"Session 字段最主要的用途是什么？\",\"options\":[\"把同一用户的一轮或多轮交互串成会话\",\"记录模型版本\",\"标记哪条 Trace 最贵\",\"替代 User ID 做权限校验\"],\"answer\":0,\"explain\":\"Session 用来聚合多轮交互，排障时可以沿着同一会话回看上下文，而不是只看单次请求。\"},{\"q\":\"一次调用大模型生成内容，通常会被记录成哪种 Observation？\",\"options\":[\"tool\",\"retriever\",\"event\",\"generation\"],\"answer\":3,\"explain\":\"调用 Chat Model 或 LLM 时会自动上报 generation，它记录输入输出、模型、Token 和成本等信息。\"},{\"q\":\"LangChain Tool 被实际执行时，通常自动生成哪类 Observation？\",\"options\":[\"generation\",\"tool\",\"span\",\"evaluator\"],\"answer\":1,\"explain\":\"工具实际执行会记录为 tool；没有执行的工具描述只是提示词的一部分，不会产生执行节点。\"},{\"q\":\"把提示词放进 Langfuse 管理，最重要的收益是？\",\"options\":[\"提示词会自动变得更准确\",\"再也不需要测试提示词\",\"可以获得版本、标签、变量注入和运行时读取能力\",\"模型会自动选择最便宜的供应商\"],\"answer\":2,\"explain\":\"提示词管理的核心是配置化和版本化，让修改、回滚、灰度与观测数据能对应到具体版本。\"},{\"q\":\"为什么生产环境更推荐用 SDK 上报，而不是手写 HTTP 请求？\",\"options\":[\"SDK 能自动处理上下文传播、嵌套关系和批量上报\",\"SDK 一定比 HTTP 快十倍\",\"HTTP 无法携带 JSON\",\"SDK 可以绕过 Langfuse 的鉴权\"],\"answer\":0,\"explain\":\"SDK 的价值在于自动维护 Trace 上下文和节点层级，减少手工拼字段导致的链路断裂。\"},{\"q\":\"给 Trace 标记 Environment 的主要作用是？\",\"options\":[\"决定使用哪个 Embedding 模型\",\"自动删除过期数据\",\"把 Prompt 翻译成英文\",\"区分生产、预发、开发等环境的数据\"],\"answer\":3,\"explain\":\"Environment 是筛选和分析的维度，避免把测试流量与生产流量混在一起得出错误结论。\"},{\"q\":\"自部署 Langfuse 时，下列哪组依赖最符合课程里的典型组成？\",\"options\":[\"MySQL、Kafka、Hadoop、Spark\",\"Postgres、ClickHouse、Redis、MinIO\",\"SQLite、Milvus、Nacos、OpenSandbox\",\"MongoDB、Elasticsearch、RabbitMQ、MinIO\"],\"answer\":1,\"explain\":\"课程中的 Langfuse 依赖 Postgres 存业务数据、ClickHouse 做分析、Redis 做缓存/队列、MinIO 存对象。\"}]},{\"id\":\"evaluation\",\"name\":\"评估体系\",\"range\":\"第 7-11 章\",\"questions\":[{\"q\":\"设计 LLM as Judge 评估器时，最推荐的做法是？\",\"options\":[\"用一个超长提示词同时评估所有维度\",\"只让模型输出「好」或「不好」\",\"一个评估器只评估一个清晰维度，并给出评分锚点\",\"完全依赖模型自由发挥，不定义分数范围\"],\"answer\":2,\"explain\":\"单维度加明确评分锚点能降低评审歧义，也便于用人工标注校准和定位问题。\"},{\"q\":\"「相关性」评估器最应该判断什么？\",\"options\":[\"输出是否直接回应了用户的问题、意图和约束\",\"答案中的事实是否全部正确\",\"语言是否像真人写的\",\"是否泄露了用户隐私\"],\"answer\":0,\"explain\":\"相关性关注「有没有回答用户真正问的内容」；事实正确性、自然度和隐私应由独立评估器负责。\"},{\"q\":\"课程中「自然度（低 AI 味）」评估器通常使用什么分数类型？\",\"options\":[\"BOOLEAN\",\"CATEGORICAL，只能是 A/B/C\",\"无需评分，只记录文本长度\",\"NUMERIC，范围 0 到 1\"],\"answer\":3,\"explain\":\"自然度是连续质量维度，用 0 到 1 的数值分更利于比较和聚合。\"},{\"q\":\"「隐私泄露」更适合使用哪种评分类型？\",\"options\":[\"0 到 100 的连续分\",\"BOOLEAN，只判断是否发生泄露\",\"按回答长度打分\",\"按模型价格打分\"],\"answer\":1,\"explain\":\"隐私泄露通常是明确的是非判断，布尔值比模糊的连续分更稳定，也便于设置硬性门槛。\"},{\"q\":\"一个合格的数据集数据项至少应包含什么？\",\"options\":[\"模型名称和 API Key\",\"Trace ID 和服务器 IP\",\"用户输入和期望输出\",\"只包含用户输入即可\"],\"answer\":2,\"explain\":\"数据项代表一个典型业务场景，需要输入与期望输出，才能比较实际输出并做回归。\"},{\"q\":\"为什么说没有数据集就很难证明 Agent「变好了」？\",\"options\":[\"因为缺少固定样本就无法复现和比较不同版本\",\"因为模型只能读取数据集\",\"因为数据集会自动提高模型分数\",\"因为 Langfuse 只支持有数据集的实验\"],\"answer\":0,\"explain\":\"数据集提供可重复的对照组；没有固定样本，单次演示无法排除偶然性和场景偏差。\"},{\"q\":\"人工评估在评估体系中最不可替代的价值是？\",\"options\":[\"比所有自动评估都便宜\",\"可以完全替代线上监控\",\"自动生成所有测试数据\",\"处理主观质量、业务规则，并为自动评估器提供校准基准\"],\"answer\":3,\"explain\":\"人工判断适合主观和复杂业务标准，也能用来检验 LLM Judge 是否与人类判断一致。\"},{\"q\":\"优化评估器时，下列哪种做法最可靠？\",\"options\":[\"不断加长提示词，直到分数变高\",\"用人工标注样本检查一致性，针对误判边界补规则和反例\",\"只保留评估器给出高分的样本\",\"频繁更换评估模型但不做对比\"],\"answer\":1,\"explain\":\"评估器优化的目标是和人类判断对齐，应该看误判类型和边界样本，而不是只追求分数好看。\"}]},{\"id\":\"experiment\",\"name\":\"实验与上线\",\"range\":\"第 12-21 章\",\"questions\":[{\"q\":\"做一次可归因的离线实验，最重要的控制原则是？\",\"options\":[\"同时更换模型、提示词和评估器\",\"每次只跑一个样本\",\"固定数据集与评估器，只改变一个待验证变量\",\"只看最终平均分，不看分布\"],\"answer\":2,\"explain\":\"控制变量才能把分数变化归因到具体改动；同时改多项会让结论无法解释。\"},{\"q\":\"UI 离线评估和 SDK 离线评估的主要差异是？\",\"options\":[\"SDK 更适合纳入代码、CI 和自动化回归\",\"UI 不需要数据集，SDK 需要\",\"UI 只能评估文本，SDK 只能评估图片\",\"两者完全不能得到相同指标\"],\"answer\":0,\"explain\":\"UI 适合快速操作和观察，SDK 把流程代码化，便于批量、自动化和版本管理。\"},{\"q\":\"把离线评估接入 Pytest 时，合理的质量门槛是？\",\"options\":[\"所有样本必须 100 分，否则永远失败\",\"只检查测试是否运行，不检查分数\",\"每次模型更新都关闭测试\",\"按业务设置阈值，并对硬性规则和统计指标分别处理\"],\"answer\":3,\"explain\":\"质量门槛要兼顾业务风险和模型波动，硬性安全规则可以严格，统计质量指标应设置合理阈值。\"},{\"q\":\"Langfuse Webhook 调用 Agent Server 后返回 202，说明什么？\",\"options\":[\"实验已经执行完成并写回结果\",\"请求已被接受，但 Agent 任务不一定执行完成\",\"Webhook 签名验证失败\",\"Langfuse 已经替 Agent 运行了模型\"],\"answer\":1,\"explain\":\"202 是「已接受」而不是「已完成」；真正的执行、结果生成和回写要另行确认。\"},{\"q\":\"本地开发时，容器内的 Langfuse 要访问宿主机上的 Agent Server，常用哪个特殊域名？\",\"options\":[\"localhost\",\"gateway.docker\",\"host.docker.internal\",\"container.host\"],\"answer\":2,\"explain\":\"host.docker.internal 是 Docker 提供的宿主机访问名；同时要把该域名加入 Langfuse 的 Webhook 白名单。\"},{\"q\":\"Langfuse 对 Webhook 地址的常见限制是？\",\"options\":[\"只允许 HTTP 80 或 HTTPS 443，并限制域名白名单\",\"只允许使用 8080 端口\",\"必须是公网 IP，不能使用域名\",\"只能使用 GET 请求\"],\"answer\":0,\"explain\":\"课程中的 Webhook 需要 80/443，并把 host.docker.internal 等域名加入白名单，否则回调会被拒绝。\"},{\"q\":\"要监控「模型调用费用突然升高」，最贴近的指标配置是？\",\"options\":[\"Traces 的数量做 Min，并筛选 event\",\"只看 CPU 使用率\",\"只统计用户登录次数\",\"Observations 的 Total Cost 做 Sum，并筛选 generation\"],\"answer\":3,\"explain\":\"成本来自 generation 的 Token 费用，按 Observation 的 Total Cost 求和并设置告警阈值更直接。\"},{\"q\":\"清理 Langfuse 旧数据时，最需要避免的是什么？\",\"options\":[\"保留排障窗口内的 Trace\",\"误删仍在评估或审计周期内的数据\",\"按环境筛选数据\",\"用自动化任务执行清理\"],\"answer\":1,\"explain\":\"清理的目标是控制成本，但必须保留排障、评估和合规所需的数据；应先验证筛选条件再执行。\"}]}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale
