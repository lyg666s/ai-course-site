hunks/app/quiz/%5Bkey%5D/page-a146950e24f86a50.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"main\",null,{\"className\":\"mx-auto max-w-[56rem] px-4 pb-20 pt-6 sm:px-6\",\"children\":[\"$\",\"$L10\",null,{\"courseKey\":\"infra\",\"title\":\"Agent 基础建设\",\"intro\":\"按「网关治理 → 配置资产 → 沙箱存储」三个板块整理。题目更偏生产环境取舍，答题时先想清楚「故障会怎样扩散」。\",\"blocks\":[{\"id\":\"gateway\",\"name\":\"网关与模型治理\",\"range\":\"第 1-12 章\",\"questions\":[{\"q\":\"Docker Compose 主要解决什么问题？\",\"options\":[\"把 Python 代码自动翻译成容器镜像\",\"替代 Kubernetes 做跨机房调度\",\"统一声明多个容器的网络、环境变量、依赖和启动方式\",\"自动为模型生成 API Key\"],\"answer\":2,\"explain\":\"Compose 是单机多容器编排工具，重点是让一组服务的依赖关系与配置可重复地启动。\"},{\"q\":\"企业里引入 AI 网关最核心的目的是？\",\"options\":[\"统一收敛供应商差异、凭证、路由、限流和观测\",\"让所有模型都变成同一个模型\",\"替代 Agent 框架\",\"减少提示词长度\"],\"answer\":0,\"explain\":\"AI 网关是模型访问的控制面，让业务通过稳定入口访问多个供应商，同时集中处理可靠性、成本和治理。\"},{\"q\":\"统一使用 OpenAI Chat Completions 接口的主要取舍是？\",\"options\":[\"能力最强，但只支持 OpenAI 模型\",\"最安全，但无法做流式输出\",\"只适合 Embedding，不适合对话\",\"兼容性最好，但可能丢失思维链等供应商特有信息\"],\"answer\":3,\"explain\":\"Chat Completions 的兼容面最广，代价是部分模型的思维链等扩展信息无法完整透传。\"},{\"q\":\"在 LiteLLM 的分层里，Deployment 指的是？\",\"options\":[\"业务侧拿到的虚拟密钥\",\"一个「模型 + 分组名 + 凭证」的可路由单元\",\"只有供应商名称\",\"一条用户会话\"],\"answer\":1,\"explain\":\"Deployment 是网关实际可路由的模型部署，绑定上游模型、模型分组和凭证；Virtual Key 才是业务入口。\"},{\"q\":\"为什么建议至少准备三个账号独立的凭证？\",\"options\":[\"为了让日志更好看\",\"因为 LiteLLM 强制要求三个\",\"为了支持熔断、回退和额度隔离，避免单账号故障拖垮服务\",\"为了同时调用三个模型生成一个答案\"],\"answer\":2,\"explain\":\"独立凭证能避免单账号限流或故障造成全局不可用，也为同模型组内的回退提供候选。\"},{\"q\":\"least-busy 和 latency-based-routing 的核心差异是？\",\"options\":[\"前者看当前并发，后者依据历史响应耗时\",\"前者只支持 Embedding，后者只支持聊天\",\"两者完全一样\",\"前者比后者便宜\"],\"answer\":0,\"explain\":\"least-busy 选择当前请求数最少的部署；latency-based 依赖近期延迟统计，适合延迟差异明显的场景。\"},{\"q\":\"LiteLLM 的熔断机制最准确的描述是？\",\"options\":[\"当前请求失败后，所有请求立即停止\",\"自动把故障模型替换成任意其他模型\",\"只在每天凌晨执行一次\",\"故障 Deployment 进入冷却期，后续请求暂时绕开它\"],\"answer\":3,\"explain\":\"熔断针对的是后续路由：故障部署在冷却期内退出候选列表，同组其他部署仍可服务。\"},{\"q\":\"上游返回 429 时，为什么还需要网关侧的入口并发控制？\",\"options\":[\"因为 429 表示鉴权失败\",\"因为 429 只代表上游限流，网关自身也可能被过多请求压垮\",\"因为入口限流可以替代所有重试\",\"因为网关并发控制能提高模型智商\"],\"answer\":1,\"explain\":\"模型并发限制的是上游配额，网关入口队列限制的是自身承载；两者解决不同层面的过载。\"}]},{\"id\":\"registry\",\"name\":\"配置与资产\",\"range\":\"第 13-17 章\",\"questions\":[{\"q\":\"AI Registry 主要治理哪些资产？\",\"options\":[\"只治理模型权重\",\"只治理数据库表\",\"Prompt、Skill、MCP、AgentSpec 等运行期配置资产\",\"只治理服务器磁盘\"],\"answer\":2,\"explain\":\"AI Registry 管的是 Agent 运行时依赖的配置资产，让它们具备版本、权限、复用和动态加载能力。\"},{\"q\":\"AgentSpec 通常不包含下列哪一项？\",\"options\":[\"宿主机的 CPU 温度\",\"使用的模型\",\"允许加载的 Skill 和 MCP\",\"可调用的工具与子代理\"],\"answer\":0,\"explain\":\"AgentSpec 描述 Agent 的组装方式与能力边界，不负责采集宿主机硬件温度这类运行监控数据。\"},{\"q\":\"把 Agent 配置放进 Nacos，相比写死在代码里的主要优势是？\",\"options\":[\"代码会自动消失\",\"模型推理速度会变快\",\"不再需要任何配置校验\",\"配置可以集中管理、按环境调整并动态生效\"],\"answer\":3,\"explain\":\"配置中心让同一份代码加载不同环境或租户的配置，但必须补充校验、缓存和回滚。\"},{\"q\":\"调用 Nacos 的 Skill 下载接口时，为什么不能一律按 JSON 解析？\",\"options\":[\"因为 Nacos 不支持 JSON\",\"因为 Skill 下载返回的是 ZIP 字节流\",\"因为 Token 一定过期\",\"因为 ZIP 比 JSON 更安全\"],\"answer\":1,\"explain\":\"课程里普通接口返回 code/message/data 的 JSON，而 Skill 下载返回 ZIP 字节流，需要按响应类型分别处理。\"},{\"q\":\"配置中心不可用时，更合理的运行时策略是？\",\"options\":[\"所有请求立即失败，不做任何降级\",\"无限重试直到配置中心恢复\",\"使用本地缓存或默认配置，并记录降级状态\",\"自动删除所有已加载的 Agent\"],\"answer\":2,\"explain\":\"配置中心是控制面，不能成为业务单点；缓存、默认值与降级能保证已运行能力继续服务。\"},{\"q\":\"Agent 动态配置上线前，最应该先明确什么？\",\"options\":[\"哪些字段允许热更新、生效时机和回滚方式\",\"配置文件的字体大小\",\"Nacos 的登录页颜色\",\"模型回答的字数必须固定\"],\"answer\":0,\"explain\":\"动态配置需要边界和治理，否则线上行为会变得不可追踪；回滚能力比「能改」更重要。\"},{\"q\":\"配置驱动 Agent 组装，正确的理解是？\",\"options\":[\"配置可以完全替代代码和测试\",\"只有云端才能使用\",\"配置越多，Agent 一定越聪明\",\"把组装关系从执行逻辑中解耦，但仍要校验和版本管理\"],\"answer\":3,\"explain\":\"配置驱动提高复用和调整速度，但非法配置、缺省值和版本兼容仍要由代码与流程兜底。\"},{\"q\":\"为什么 Prompt、Skill 这类资产不适合长期散落在业务代码里？\",\"options\":[\"因为代码文件不能超过 100 行\",\"因为它们需要独立版本、复用、权限和动态更新\",\"因为模型无法读取代码中的字符串\",\"因为放进配置中心后就不需要测试\"],\"answer\":1,\"explain\":\"这些资产变化频率高、跨 Agent 复用，需要独立治理；但治理不等于免测试。\"}]},{\"id\":\"sandbox\",\"name\":\"沙箱与存储\",\"range\":\"第 18-30 章\",\"questions\":[{\"q\":\"Container 与 VM 在隔离性上的主要差异是？\",\"options\":[\"容器不能运行 Python\",\"VM 不能联网\",\"容器共享宿主内核，VM 拥有独立内核\",\"两者隔离性完全一样\"],\"answer\":2,\"explain\":\"容器依赖命名空间和 cgroups，隔离较轻；VM 有独立内核，隔离更强但成本更高。\"},{\"q\":\"自定义沙箱镜像最重要的工程价值是？\",\"options\":[\"让每次执行环境可重复、可版本追踪\",\"保证模型回答一定正确\",\"替代 Agent 的提示词\",\"让文件系统永久保存\"],\"answer\":0,\"explain\":\"镜像固定了运行时、工具版本和工作目录，减少「同一任务在不同机器结果不同」的问题。\"},{\"q\":\"复用沙箱时，最需要额外设计的是什么？\",\"options\":[\"把沙箱永久设为只读\",\"让所有用户共用同一个 root 目录\",\"禁止任何文件上传\",\"生命周期、隔离边界和上次残留状态的清理\"],\"answer\":3,\"explain\":\"复用降低启动成本，但必须明确归属、回收和清理，否则会引入数据串扰和资源泄漏。\"},{\"q\":\"为什么业务不应直接使用 MinIO 的 root 凭据？\",\"options\":[\"root 不能上传文件\",\"root 凭据权限过大，泄露后影响整个对象存储\",\"root 只能读取 JSON\",\"root 凭据无法删除\"],\"answer\":1,\"explain\":\"应使用最小权限策略和专用服务账号，把桶与前缀范围限制在业务需要内。\"},{\"q\":\"让沙箱直接上传产物到 MinIO 的主要收益是？\",\"options\":[\"可以让对象存储自动生成答案\",\"不再需要任何鉴权\",\"避免大文件经过 Agent 服务中转，降低内存与带宽压力\",\"文件会自动变成向量\"],\"answer\":2,\"explain\":\"直传减少中间层转发成本，但要额外处理临时凭证、网络可达和失败补偿。\"},{\"q\":\"Skill 放在共享只读卷，而不是每个用户专属卷，主要解决什么？\",\"options\":[\"重复存储、重复同步和版本不一致\",\"模型上下文过长\",\"用户无法登录\",\"对象存储无法创建桶\"],\"answer\":0,\"explain\":\"共享只读卷让公共 Skill 只保留一份、统一更新，同时防止 Agent 执行时篡改公共能力。\"},{\"q\":\"沙箱后端适配层的核心作用是？\",\"options\":[\"替代所有业务逻辑\",\"直接生成模型提示词\",\"让沙箱拥有无限资源\",\"把创建、执行、上传、销毁封装成稳定接口，隔离具体沙箱厂商\"],\"answer\":3,\"explain\":\"Agent 依赖稳定抽象而不是某个沙箱实现，才能替换供应商并统一处理超时、清理和并发。\"},{\"q\":\"「沙箱产物自动部署」完成后，判断成功最不能只看什么？\",\"options\":[\"目标服务健康检查是否通过\",\"文件是否上传成功\",\"部署版本是否正确\",\"失败是否能回滚\"],\"answer\":1,\"explain\":\"上传成功只说明产物到达存储，部署是否生效还要看目标环境、健康检查和版本验证。\"}]}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"面试题库 · Agent 基础建设 · AI大全栈\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Agent 基础建设课程配套面试题，按知识板块练习并查看解析。\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f
