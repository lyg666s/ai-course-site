<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
  <title id="title">AI 网关分发请求</title>
  <desc id="desc">客户端只连接 AI 网关，网关将请求分发给三个上游供应商。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1080" height="440" rx="24" fill="#f8fafc"/>

  <!-- The client has one connection, regardless of how many suppliers exist. -->
  <rect x="65" y="177" width="205" height="86" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="167.5" y="228" text-anchor="middle" font-size="29" font-weight="600" fill="#1e293b" font-family="PingFang SC, Microsoft YaHei, sans-serif">客户端</text>

  <path d="M 270 220 H 384" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="400" y="163" width="220" height="114" rx="18" fill="#2563eb"/>
  <text x="510" y="230" text-anchor="middle" font-size="31" font-weight="600" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif">AI 网关</text>

  <!-- Each arrow is an alternative upstream route from the same gateway. -->
  <path d="M 620 220 H 685 V 100 H 774" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 620 220 H 774" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 620 220 H 685 V 340 H 774" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
    <rect x="790" y="62" width="230" height="76" rx="16"/>
    <rect x="790" y="182" width="230" height="76" rx="16"/>
    <rect x="790" y="302" width="230" height="76" rx="16"/>
  </g>
  <g text-anchor="middle" font-size="25" font-weight="600" fill="#1e293b" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="905" y="109">上游供应商 A</text>
    <text x="905" y="229">上游供应商 B</text>
    <text x="905" y="349">上游供应商 C</text>
  </g>
</svg>
