<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">AgentSpec 的配置关系</title>
  <desc id="desc">一个 Agent 对应一个 AgentSpec。AgentSpec 包含一个 Agents.md 文件，描述 Agent 指令，通常作为系统提示词的一部分；同时包含自定义配置，例如 Skills、Tools、MCP 和其他配置。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#4f6f9e"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183153" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1440" height="720" fill="#f5f8fc"/>
  <circle cx="1360" cy="20" r="220" fill="#e7f0ff" opacity="0.65"/>
  <circle cx="44" cy="704" r="175" fill="#e9f8f5" opacity="0.75"/>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="72" y="83" font-size="39" font-weight="700" fill="#142744">AgentSpec 配置了什么？</text>
    <text x="73" y="127" font-size="21" fill="#53647e">一个 Agent 对应一个 AgentSpec；AgentSpec 汇集指令与扩展配置。</text>

    <!-- Agent and its one-to-one relationship to AgentSpec. -->
    <rect x="70" y="282" width="252" height="178" rx="24" fill="#244d8e" filter="url(#shadow)"/>
    <circle cx="196" cy="338" r="27" fill="#ffffff" opacity="0.16"/>
    <rect x="182" y="326" width="28" height="25" rx="7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="189" cy="337" r="2.2" fill="#ffffff"/>
    <circle cx="203" cy="337" r="2.2" fill="#ffffff"/>
    <path d="M 192 345 Q 196 348 200 345 M 196 319 V 325" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="196" y="400" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">Agent</text>
    <text x="196" y="432" text-anchor="middle" font-size="17" fill="#d9e9ff">运行中的智能体</text>

    <path d="M 324 371 H 425" fill="none" stroke="#4f6f9e" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="345" y="325" width="68" height="31" rx="15.5" fill="#e5eefb"/>
    <text x="379" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#315b95">1 : 1</text>

    <!-- Everything inside this boundary belongs to one AgentSpec. -->
    <rect x="450" y="181" width="918" height="425" rx="28" fill="#ffffff" stroke="#d6e1f0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="450" y="181" width="918" height="80" rx="28" fill="#eaf2ff"/>
    <path d="M 450 234 H 1368 V 261 H 450 Z" fill="#eaf2ff"/>
    <rect x="482" y="208" width="8" height="28" rx="4" fill="#326cc1"/>
    <text x="508" y="237" font-size="31" font-weight="700" fill="#1b3f73">AgentSpec</text>
    <text x="1330" y="234" text-anchor="end" font-size="17" fill="#59708d">该 Agent 的配置描述</text>

    <!-- The instruction file is a single component of the spec. -->
    <rect x="486" y="289" width="379" height="266" rx="21" fill="#f2f7ff" stroke="#b9d1f5" stroke-width="2"/>
    <rect x="511" y="315" width="46" height="49" rx="9" fill="#dbeaff"/>
    <path d="M 525 328 H 544 M 525 337 H 544 M 525 346 H 539" fill="none" stroke="#3671bd" stroke-width="2.5" stroke-linecap="round"/>
    <text x="576" y="349" font-size="28" font-weight="700" fill="#1b4b88">Agents.md</text>
    <text x="514" y="408" font-size="22" font-weight="600" fill="#223a5c">Agent 的指令</text>
    <text x="514" y="444" font-size="19" fill="#4f6380">描述角色、目标与行为要求</text>
    <rect x="510" y="482" width="326" height="47" rx="13" fill="#dfeaff"/>
    <text x="673" y="513" text-anchor="middle" font-size="18" font-weight="600" fill="#315b95">通常是系统提示词的一部分</text>

    <!-- Additional configuration can reference many capabilities. -->
    <rect x="888" y="289" width="444" height="266" rx="21" fill="#f0faf7" stroke="#a9dbcf" stroke-width="2"/>
    <rect x="913" y="315" width="46" height="49" rx="9" fill="#d9f3ec"/>
    <circle cx="936" cy="332" r="4" fill="#16836e"/>
    <circle cx="925" cy="346" r="4" fill="#16836e"/>
    <circle cx="947" cy="346" r="4" fill="#16836e"/>
    <path d="M 934 336 L 927 342 M 939 336 L 945 342" fill="none" stroke="#16836e" stroke-width="2.5"/>
    <text x="978" y="349" font-size="28" font-weight="700" fill="#116858">自定义配置</text>
    <text x="914" y="407" font-size="19" fill="#476d65">定义 Agent 可用的能力与连接，例如：</text>

    <rect x="913" y="434" width="112" height="43" rx="12" fill="#ffffff" stroke="#a9dbcf"/>
    <rect x="1038" y="434" width="112" height="43" rx="12" fill="#ffffff" stroke="#a9dbcf"/>
    <rect x="1163" y="434" width="112" height="43" rx="12" fill="#ffffff" stroke="#a9dbcf"/>
    <g text-anchor="middle" font-size="19" font-weight="600" fill="#116858">
      <text x="969" y="462">Skills</text>
      <text x="1094" y="462">Tools</text>
      <text x="1219" y="462">MCP</text>
    </g>
    <text x="914" y="521" font-size="18" fill="#5c766f">以及其他需要的配置…</text>

    <text x="909" y="585" text-anchor="middle" font-size="20" font-weight="600" fill="#435875">AgentSpec = Agents.md 指令 + 自定义配置</text>
  </g>
</svg>
