<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" role="img" aria-labelledby="title desc">
  <title id="title">模型请求链路中的三处潜在转换</title>
  <desc id="desc">请求从 LangChain Provider 到 LiteLLM 网关，再到上游供应商。如果上游是聚合商，还可能转发给另一家上游供应商。三段连接各可能发生一次转换，最后一段可选。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowOptional" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1500" height="660" rx="28" fill="#f8fafc"/>
  <text x="70" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="#0f172a">一次模型调用，最多经过三处转换</text>
  <text x="70" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#475569">从 Provider 发出请求开始，沿途的格式适配与再次转发都可能引入兼容性问题。</text>

  <path d="M 330 308 H 424" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 700 308 H 794" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1070 308 H 1164" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowOptional)"/>

  <rect x="70" y="220" width="260" height="176" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="440" y="220" width="260" height="176" rx="20" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="810" y="220" width="260" height="176" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <g opacity="0.52">
    <rect x="1180" y="220" width="260" height="176" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="1310" y="307" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">上游供应商</text>
    <text x="1310" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#475569">实际模型提供方</text>
  </g>

  <g text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="200" y="300" font-size="28" font-weight="700" fill="#075985">LangChain</text>
    <text x="200" y="339" font-size="28" font-weight="700" fill="#075985">Provider</text>
    <text x="570" y="307" font-size="30" font-weight="700" fill="#ffffff">LiteLLM 网关</text>
    <text x="570" y="350" font-size="19" fill="#dbeafe">统一入口与路由</text>
    <text x="940" y="307" font-size="29" font-weight="700" fill="#0f172a">上游供应商</text>
    <text x="940" y="350" font-size="19" fill="#475569">可能是聚合商</text>
    <text x="1310" y="184" font-size="18" font-weight="700" fill="#64748b">可选：聚合商继续转发</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="290" y="433" width="190" height="91" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="385" y="469" font-size="21" font-weight="700" fill="#9a3412">转换 ①</text>
    <text x="385" y="499" font-size="18" fill="#7c2d12">请求格式适配</text>
    <rect x="660" y="433" width="190" height="91" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="755" y="469" font-size="21" font-weight="700" fill="#9a3412">转换 ②</text>
    <text x="755" y="499" font-size="18" fill="#7c2d12">上游协议适配</text>
    <g opacity="0.58">
      <rect x="1030" y="433" width="190" height="91" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="7 5"/>
      <text x="1125" y="469" font-size="21" font-weight="700" fill="#9a3412">转换 ③</text>
      <text x="1125" y="499" font-size="18" fill="#7c2d12">再次转发适配</text>
    </g>
  </g>

  <rect x="70" y="564" width="1370" height="60" rx="14" fill="#e2e8f0"/>
  <text x="755" y="603" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#334155">每一次转换，都可能带来参数、协议、工具调用或响应格式的兼容性问题</text>
</svg>
