<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">LiteLLM 熔断与回退的作用范围</title>
  <desc id="desc">模型组 A 中的两个 Deployment 分别熔断；当整个模型组 A 不可用时，请求回退到模型组 B。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="360" rx="24" fill="#f8fafc"/>

  <rect x="50" y="48" width="390" height="264" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="245" y="92" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型组 A</text>
  <g fill="#fff7f7" stroke="#ef4444" stroke-width="2">
    <rect x="88" y="118" width="314" height="65" rx="13"/>
    <rect x="88" y="200" width="314" height="65" rx="13"/>
  </g>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#334155">
    <text x="111" y="158">Deployment 1</text>
    <text x="111" y="240">Deployment 2</text>
  </g>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#dc2626" text-anchor="end">
    <text x="380" y="158">已熔断</text>
    <text x="380" y="240">已熔断</text>
  </g>

  <path d="M 440 180 H 591" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="519" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#2563eb" font-family="PingFang SC, Microsoft YaHei, sans-serif">回退</text>
  <text x="519" y="217" text-anchor="middle" font-size="16" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif">整组不可用</text>

  <rect x="610" y="48" width="340" height="264" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="780" y="92" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型组 B</text>
  <rect x="648" y="159" width="264" height="65" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="780" y="200" text-anchor="middle" font-size="22" fill="#1e3a8a" font-family="PingFang SC, Microsoft YaHei, sans-serif">Deployment 3</text>
</svg>
